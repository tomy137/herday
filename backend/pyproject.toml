[project]
name = "herday-backend"
version = "0.1.0"
description = "HerDay - Calendrier de suivi du cycle menstruel"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "aiosmtplib>=3.0",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
